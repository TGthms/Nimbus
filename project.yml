name: Nimbus
options:
  bundleIdPrefix: app.nimbus
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Nimbus:
    type: application
    platform: macOS
    sources:
      - path: Nimbus
        excludes:
          - Resources/Info.plist
          - Resources/Nimbus.entitlements
      - path: NimbusShared
        excludes:
          - NimbusShared.h
    resources:
      - path: Nimbus/Resources/Assets.xcassets
    dependencies:
      - target: NimbusWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Nimbus
        PRODUCT_BUNDLE_IDENTIFIER: app.nimbus.mac
        INFOPLIST_FILE: Nimbus/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Nimbus/Resources/Nimbus.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        ENABLE_PREVIEWS: YES
    info:
      path: Nimbus/Resources/Info.plist
  NimbusWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: NimbusWidgets
        excludes:
          - Info.plist
          - NimbusWidgets.entitlements
      - path: NimbusShared
        excludes:
          - NimbusShared.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nimbus.mac.widgets
        INFOPLIST_FILE: NimbusWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: NimbusWidgets/NimbusWidgets.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
    info:
      path: NimbusWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nimbus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Nimbus:
    build:
      targets:
        Nimbus: all
        NimbusWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
